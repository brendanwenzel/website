[package]
name = "telemetry-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# axum 0.8 — SSE API (Sse, Event, KeepAlive, Event::json_data) is identical to 0.7.
# The 0.7 -> 0.8 breaking changes (`/{param}` route syntax, #[async_trait] removal)
# don't touch this service; it has a single static route.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "io-util", "time", "signal"] }
# `sync` feature is required for tokio_stream::wrappers::BroadcastStream.
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
