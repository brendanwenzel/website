<!doctype html>
<!--
  Self-contained SSE stream verifier (vanilla EventSource, no build step).

  CORS applies to EventSource, and a page opened via file:// sends
  `Origin: null` — which the backend (correctly) rejects. So serve this file
  over HTTP and allow that origin:

      ALLOWED_ORIGIN=http://localhost:8000 cargo run
      python3 -m http.server 8000        # from this directory
      open http://localhost:8000/test.html

  Injecting a fake event on a box with systemd:

      systemd-cat -t test echo "EVENT=purchase_captured amount=$9.99"

  That line will be DROPPED (systemd-cat's unit is not in the allowlist) —
  which is the point: it doubles as a manual default-deny check. To see real
  output, run the real services, or temporarily add your test unit to
  UNIT_NAMES in src/sanitizer.rs and to the UNITS env var.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>telemetry-backend stream test</title>
  <style>
    body { font-family: ui-monospace, monospace; background: #09090b; color: #d4d4d8; padding: 2rem; }
    #status { padding: .25rem .75rem; border-radius: 999px; display: inline-block; margin-bottom: 1rem; }
    .open { background: #064e3b; color: #6ee7b7; }
    .error { background: #7f1d1d; color: #fca5a5; }
    li { margin: .25rem 0; }
    .replay { opacity: .55; }
  </style>
</head>
<body>
  <h1>telemetry-backend /events</h1>
  <div id="status" class="error">connecting…</div>
  <ol id="events" reversed></ol>
  <script>
    const url = 'http://127.0.0.1:8088/events';
    const status = document.getElementById('status');
    const list = document.getElementById('events');
    let opened = false;

    const es = new EventSource(url);
    es.onopen = () => {
      status.textContent = 'connected — ' + url;
      status.className = 'open';
      // Events arriving in the first moments are the ring-buffer replay.
      setTimeout(() => { opened = true; }, 300);
    };
    es.onerror = () => {
      status.textContent = 'disconnected — retrying (native EventSource backoff)';
      status.className = 'error';
    };
    es.onmessage = (m) => {
      let ev;
      try { ev = JSON.parse(m.data); } catch { return; }
      const li = document.createElement('li');
      li.textContent = `${ev.event_type} — ${ev.source} — ${ev.timestamp}`;
      if (!opened) li.className = 'replay';
      list.prepend(li);
      while (list.children.length > 60) list.removeChild(list.lastChild);
    };
  </script>
</body>
</html>
