<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The hero's pipeline diagram as a mark: three source nodes + hub. -->
  <rect width="64" height="64" rx="14" fill="#09090b"/>
  <g stroke="#52525b" stroke-width="2.5">
    <line x1="18" y1="20" x2="32" y2="34"/>
    <line x1="46" y1="20" x2="32" y2="34"/>
    <line x1="32" y1="50" x2="32" y2="34"/>
  </g>
  <circle cx="32" cy="34" r="4.5" fill="#a1a1aa"/>
  <circle cx="18" cy="20" r="7" fill="#34d399"/>
  <circle cx="46" cy="20" r="7" fill="#38bdf8"/>
  <circle cx="32" cy="50" r="7" fill="#fbbf24"/>
</svg>
